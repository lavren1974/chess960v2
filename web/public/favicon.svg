<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)"/>
  
  <!-- King piece -->
  <g transform="translate(8, 4)">
    <path d="M6 1 L6.5 2 L8 2 L8 3.5 L7.5 4.5 L7.5 8 L9 8.5 L9 9 L3 9 L3 8.5 L4.5 8 L4.5 4.5 L4 3.5 L4 2 L5.5 2 Z" 
          fill="white" stroke="rgba(255,255,255,0.5)" stroke-width="0.3"/>
    <circle cx="6" cy="1" r="0.6" fill="white"/>
    <line x1="6" y1="0.5" x2="6" y2="1.5" stroke="white" stroke-width="0.4"/>
    <line x1="5.3" y1="1" x2="6.7" y2="1" stroke="white" stroke-width="0.4"/>
  </g>
  
  <!-- Rook piece -->
  <g transform="translate(16, 6)">
    <path d="M2 1.5 L2 2.5 L2.5 2.5 L2.5 2 L3.5 2 L3.5 2.5 L4 2.5 L4 2 L5 2 L5 2.5 L5.5 2.5 L5.5 1.5 L6 1.5 L6 7 L6.5 7 L6.5 7.5 L1.5 7.5 L1.5 7 L2 7 Z" 
          fill="white" opacity="0.85" stroke="rgba(255,255,255,0.5)" stroke-width="0.3"/>
  </g>
  
  <!-- Small "960" text -->
  <text x="16" y="28" font-family="Arial, sans-serif" font-size="6" font-weight="bold" 
        text-anchor="middle" fill="white" opacity="0.9">960</text>
</svg>
